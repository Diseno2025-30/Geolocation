name: Deploy Feature Branch to Test

on:
  push:
    branches:
      - Oliver-branch
      - Hernando-branch
      - Alan-branch
      - Sebastian-branch

  workflow_dispatch:
    inputs:
      branch:
        description: "Feature branch to deploy"
        required: true
        type: choice
        options:
          - Oliver-branch
          - Hernando-branch
          - Alan-branch
          - Sebastian-branch

jobs:
  deploy-feature:
    runs-on: ubuntu-latest

    steps:
      - name: Determine target instance
        id: determine-instance
        run: |
          # Determinar la rama actual
          if [ "${{ github.event_name }}" = "push" ]; then
            BRANCH_NAME="${{ github.ref_name }}"
          else
            BRANCH_NAME="${{ github.event.inputs.branch }}"
          fi

          echo "Branch to deploy: ${BRANCH_NAME}"

          # Mapear rama a instancia
          case "${BRANCH_NAME}" in
            "Oliver-branch")
              INSTANCE_NUM=1
              PERSON_NAME="Oliver"
              ;;
            "Hernando-branch")
              INSTANCE_NUM=2
              PERSON_NAME="Hernando"
              ;;
            "Alan-branch")
              INSTANCE_NUM=3
              PERSON_NAME="Alan"
              ;;
            "Sebastian-branch")
              INSTANCE_NUM=4
              PERSON_NAME="Sebastian"
              ;;
            *)
              echo "❌ Rama no reconocida: ${BRANCH_NAME}"
              exit 1
              ;;
          esac

          echo "TARGET_INSTANCE=${INSTANCE_NUM}" >> $GITHUB_OUTPUT
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "PERSON_NAME=${PERSON_NAME}" >> $GITHUB_OUTPUT

          echo "✅ Desplegando ${BRANCH_NAME} a instancia ${INSTANCE_NUM} (${PERSON_NAME})"

      - name: Checkout branch
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.determine-instance.outputs.BRANCH_NAME }}

      - name: Deploy to assigned instance
        env:
          HOST: ${{ secrets[format('EC2_HOST_{0}', steps.determine-instance.outputs.TARGET_INSTANCE)] }}
          USER: ${{ secrets[format('EC2_USER_{0}', steps.determine-instance.outputs.TARGET_INSTANCE)] }}
          KEY: ${{ secrets[format('EC2_SSH_KEY_{0}', steps.determine-instance.outputs.TARGET_INSTANCE)] }}
          ENV_FILE: ${{ secrets[format('ENV_FILE_{0}', steps.determine-instance.outputs.TARGET_INSTANCE)] }}
          FIREBASE_SDK: ${{ secrets.FIREBASE_SDK_JSON }}
          DOMAIN_BASE: tumaquinaya.com
          BRANCH_NAME: ${{ steps.determine-instance.outputs.BRANCH_NAME }}
          PERSON_NAME: ${{ steps.determine-instance.outputs.PERSON_NAME }}
          INSTANCE_NUM: ${{ steps.determine-instance.outputs.TARGET_INSTANCE }}
        run: |
          echo "🚀 Desplegando ${BRANCH_NAME} en instancia ${INSTANCE_NUM} (${PERSON_NAME}.${DOMAIN_BASE})"

          # Crear archivo de llave SSH
          echo "$KEY" > deploy_key
          chmod 600 deploy_key

          # Crear archivo .env temporal
          echo "$ENV_FILE" > temp_env_file
          echo "$FIREBASE_SDK" > temp_sdk.json

          # Verificar que el NAME coincida con la persona asignada
          NAME_VALUE=$(grep "^NAME=" temp_env_file | cut -d'=' -f2 | tr -d '"' | tr -d "'" | xargs)
          NAME_LOWER=$(echo "$NAME_VALUE" | tr '[:upper:]' '[:lower:]')
          PERSON_LOWER=$(echo "$PERSON_NAME" | tr '[:upper:]' '[:lower:]')

          if [ "${NAME_LOWER}" != "${PERSON_LOWER}" ]; then
              echo "⚠️ ADVERTENCIA: El NAME en .env (${NAME_VALUE}) no coincide con la persona asignada (${PERSON_NAME})"
              echo "   Esto puede causar inconsistencias. Verificar configuración."
          fi

          FULL_DOMAIN="${NAME_LOWER}.${DOMAIN_BASE}"

          echo "📋 Configuración:"
          echo "   - Rama: ${BRANCH_NAME}"
          echo "   - Persona: ${PERSON_NAME}"
          echo "   - Instancia: ${INSTANCE_NUM}"
          echo "   - Dominio: ${FULL_DOMAIN}"
          echo "   - URL de test: https://${FULL_DOMAIN}/test"

          # PASO 0: LIMPIAR PROCESOS ANTERIORES
          echo ""
          echo "🧹 ========================================="
          echo "🧹 PASO 0: LIMPIAR ESTADO ANTERIOR"
          echo "🧹 ========================================="
          echo "   Limpiando procesos colgados y archivos temporales..."
          
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -i deploy_key ${USER}@${HOST} 'bash -s' << 'CLEANUP_EOF'
          set +e
          echo "💀 ========================================="
          echo "💀 LIMPIEZA AGRESIVA - MATANDO TODO"
          echo "💀 ========================================="

          # 1. Matar procesos osm2pgsql huérfanos
          echo "🔪 Matando procesos osm2pgsql..."
          sudo pkill -9 -f osm2pgsql 2>/dev/null || true
          sudo pkill -9 -f osrm 2>/dev/null || true

          # 2. Detener PM2 y todos sus procesos
          echo "🔪 Matando procesos PM2..."
          pm2 kill 2>/dev/null || true
          sudo pkill -9 -f pm2 2>/dev/null || true
          sudo pkill -9 -f gunicorn 2>/dev/null || true
          sudo pkill -9 -f "python.*run.py" 2>/dev/null || true

          # 3. Forzar detención de TODOS los containers Docker
          echo "🔪 Forzando detención de containers Docker..."
          docker kill $(docker ps -aq) 2>/dev/null || true
          sleep 2
          docker rm -f $(docker ps -aq) 2>/dev/null || true

          # 4. Limpiar volúmenes Docker huérfanos
          echo "🔪 Limpiando volúmenes Docker..."
          docker volume rm openstreetmap-tile-data 2>/dev/null || true
          docker volume prune -f 2>/dev/null || true

          # 5. Liberar puertos ocupados
          echo "🔪 Liberando puertos..."
          sudo fuser -k 5001/tcp 2>/dev/null || true
          sudo fuser -k 5433/tcp 2>/dev/null || true
          sudo fuser -k 8080/tcp 2>/dev/null || true
          sudo fuser -k 6000/tcp 2>/dev/null || true

          # 6. Limpiar servicios systemd anteriores
          echo "🔪 Deteniendo servicios systemd..."
          sudo systemctl stop osrm 2>/dev/null || true
          sudo systemctl stop tileserver 2>/dev/null || true
          sudo systemctl disable osrm 2>/dev/null || true
          sudo systemctl disable tileserver 2>/dev/null || true

          # 7. Limpiar datos anteriores
          echo "🗑️ Limpiando datos y archivos temporales..."
          sudo rm -rf /opt/osrm-data/* 2>/dev/null || true
          sudo rm -rf /opt/tile-data/* 2>/dev/null || true
          sudo rm -f /tmp/setup_osrm.sh /tmp/deploy_test_remote.sh /tmp/setup_tileserver.sh 2>/dev/null || true
          sudo rm -f /tmp/test_env_file /tmp/firebase-admin-sdk.json /tmp/Puerto_MAP.osm.pbf 2>/dev/null || true

          # 8. Reiniciar Docker daemon limpio
          echo "🔧 Reiniciando Docker daemon..."
          sudo systemctl restart docker
          sleep 5

          # 9. Verificar que todo está limpio
          echo ""
          echo "📊 Estado post-limpieza:"
          echo "   Containers: $(docker ps -aq 2>/dev/null | wc -l)"
          echo "   Puerto 5001: $(sudo fuser 5001/tcp 2>/dev/null || echo 'libre')"
          echo "   Puerto 5433: $(sudo fuser 5433/tcp 2>/dev/null || echo 'libre')"
          echo "   Puerto 8080: $(sudo fuser 8080/tcp 2>/dev/null || echo 'libre')"
          echo "   Puerto 6000: $(sudo fuser 6000/tcp 2>/dev/null || echo 'libre')"
          echo ""
          echo "✅ Limpieza agresiva completada - instancia lista para deploy limpio"
          CLEANUP_EOF

          # Copiar scripts desde el repositorio
          cp .github/scripts/setup_osrm_feature.sh setup_osrm.sh
          cp .github/scripts/deploy_test_remote.sh deploy_test_remote.sh
          cp .github/scripts/setup_tileserver.sh setup_tileserver.sh

          # Transferir scripts y archivos al servidor
          echo ""
          echo "📤 Transfiriendo archivos al servidor..."
          
          # Verificar conectividad antes de transferir
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i deploy_key ${USER}@${HOST} "echo '✅ Conexión SSH exitosa'"
          
          # Transferir scripts
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i deploy_key setup_osrm.sh ${USER}@${HOST}:/tmp/
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i deploy_key deploy_test_remote.sh ${USER}@${HOST}:/tmp/
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i deploy_key setup_tileserver.sh ${USER}@${HOST}:/tmp/
          
          # Transferir archivos de configuración
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i deploy_key temp_env_file ${USER}@${HOST}:/tmp/test_env_file
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i deploy_key temp_sdk.json ${USER}@${HOST}:/tmp/firebase-admin-sdk.json
          
          # ✅ NUEVO: Transferir archivo OSM local (HOT Export Tool)
          echo "🗺️ Transfiriendo archivo OSM personalizado..."
          if [ -f ".github/osm/Puerto_MAP.osm.pbf" ]; then
            scp -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i deploy_key .github/osm/Puerto_MAP.osm.pbf ${USER}@${HOST}:/tmp/
            echo "✅ Archivo OSM transferido: $(ls -lh .github/osm/Puerto_MAP.osm.pbf | awk '{print $5}')"
          else
            echo "❌ ERROR: Archivo OSM no encontrado: .github/osm/Puerto_MAP.osm.pbf"
            echo "   Verifica que el archivo esté en el repositorio"
            exit 1
          fi

          echo "✅ Transferencia completada"

          # PASO 1: Configurar OSRM
          echo ""
          echo "🗺️ ========================================="
          echo "🗺️ PASO 1: CONFIGURAR OSRM"
          echo "🗺️ ========================================="
          ssh -o StrictHostKeyChecking=no -i deploy_key ${USER}@${HOST} \
            "chmod +x /tmp/setup_osrm.sh && timeout 1800 /tmp/setup_osrm.sh"

          # PASO 2: Configurar Tile Server
          echo ""
          echo "🗺️ ========================================="
          echo "🗺️ PASO 2: CONFIGURAR TILE SERVER"
          echo "🗺️ ========================================="
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=60 -i deploy_key ${USER}@${HOST} \
            "chmod +x /tmp/setup_tileserver.sh && timeout 2400 /tmp/setup_tileserver.sh"

          # PASO 3: Desplegar aplicación
          echo ""
          echo "🚀 ========================================="
          echo "🚀 PASO 3: DESPLEGAR APLICACIÓN"
          echo "🚀 ========================================="
          ssh -o StrictHostKeyChecking=no -i deploy_key ${USER}@${HOST} \
            "chmod +x /tmp/deploy_test_remote.sh && \
             timeout 300 /tmp/deploy_test_remote.sh '${NAME_LOWER}' '${DOMAIN_BASE}' '${INSTANCE_NUM}' '${BRANCH_NAME}' '${PERSON_NAME}' && \
             if [ -f /tmp/test_env_file ]; then \
               if [ -d /home/ubuntu/Web-server-UDP/test/Proyecto_1_Diseno ]; then \
                 mv /tmp/test_env_file /home/ubuntu/Web-server-UDP/test/Proyecto_1_Diseno/.env; \
               else \
                 mv /tmp/test_env_file /opt/location-tracker/test/Proyecto_1_Diseno/.env; \
               fi; \
             fi; \
             if [ -f /tmp/firebase-admin-sdk.json ]; then \
               if [ -d /home/ubuntu/Web-server-UDP/test/Proyecto_1_Diseno ]; then \
                 mv /tmp/firebase-admin-sdk.json /home/ubuntu/Web-server-UDP/test/Proyecto_1_Diseno/firebase-admin-sdk.json; \
               else \
                 mv /tmp/firebase-admin-sdk.json /opt/location-tracker/test/Proyecto_1_Diseno/firebase-admin-sdk.json; \
               fi; \
             fi; \
             rm -f /tmp/deploy_test_remote.sh /tmp/setup_osrm.sh /tmp/setup_tileserver.sh"

          # Limpiar archivos temporales locales
          rm -f deploy_key temp_env_file deploy_test_remote.sh setup_osrm.sh setup_tileserver.sh temp_sdk.json

          echo ""
          echo "========================================="
          echo "✅ DESPLIEGUE COMPLETADO"
          echo "========================================="
          echo ""
          echo "🎉 ${PERSON_NAME} puede ver sus cambios en:"
          echo "   📱 https://${FULL_DOMAIN}/test"
          echo ""
          echo "🗺️ Servicios configurados:"
          echo "   ✅ OSRM (Snap-to-Roads): puerto 5001"
          echo "   ✅ Tile Server: puerto 8080"
          echo "   ✅ Flask App (test): puerto 6000"

          echo "========================================"